# dependency_graph.yaml — Independence profile for verification paths
# Experiment: <YYYYMMDD-short-slug>
#
# PURPOSE: Make the independence of two verification paths machine-readable
# so independence_scorer.py can compute an overlap-weighted independence_score.
# A high score (≥0.7) means paths are genuinely independent;
# a low score means they share enough to have correlated blind spots.
#
# HOW TO FILL:
#   - path_a: primary verification (the builder's own check)
#   - path_b: independent reconstruction (skeptic / different model / different code)
#   - Leave a field null when not applicable (e.g. retrieval_snapshot: null if no RAG)
#   - The hook auto-detects shared_dependencies from path_a vs path_b field values
#   - independence_score is written back by independence_scorer.py — do not fill manually

experiment_id: "<YYYYMMDD-short-slug>"

# Optional: per-claim granularity (use experiment_id if claim_id is omitted)
claim_id: null

paths:
  path_a:
    label: "Primary verification"  # human-readable description
    model_family: null              # e.g. "claude-sonnet", "gpt-4", "gemini-pro"
    model_version: null             # exact version if known, else null
    retrieval_snapshot: null        # sha256 of RAG corpus snapshot, or null
    code_commit: null               # git SHA of code used, or null
    libraries: []                   # list of "package==version" strings
    dataset: null                   # dataset identifier or path
    definition_of_metric: null      # how the key metric is defined/operationalised
    executor: null                  # who ran it: "agent-A", "human-X", "CI"
    verification_substrate: null    # OBSERVE-only, not scored (see below) --
                                     # what KIND of check this path is, e.g.
                                     # same_model / different_model /
                                     # executable_test / formal_proof /
                                     # simulation / independent_dataset /
                                     # physical_experiment / human_expert

  path_b:
    label: "Independent reconstruction"
    model_family: null
    model_version: null
    retrieval_snapshot: null
    code_commit: null
    libraries: []
    dataset: null
    definition_of_metric: null
    executor: null
    verification_substrate: null

# Filled automatically by independence_scorer.py — edit only to correct errors
shared_dependencies: []   # list of {field: value} pairs detected as shared

# Filled automatically by independence_scorer.py — the full per-dimension breakdown
# compute_independence() already computes internally (dimension/a_val/b_val/shared/
# weight/contribution/skipped) for every field ACTUALLY IN _WEIGHTS: model_family,
# dataset, code_commit, libraries, retrieval_snapshot, definition_of_metric — six,
# not eight (a prior version of this comment listed model_version and executor here
# too, as if they were scored; they never were, that was a doc/code drift, fixed
# 2026-09-16). This is the machine-readable answer to "actor/model/context/data/tool
# independence", per-dimension rather than blended into one score. Added 2026-09-12
# (Research/Evidence Loop minimal extension) — a dependency_graph.yaml written before
# this field existed simply has no dimension_detail: line; the hook only writes it
# back when present.
#
# Also carries one OBSERVE-only row per field in independence_scorer.py's
# _OBSERVE_ONLY_DIMENSIONS (currently just verification_substrate, see above) —
# marked `observer_only: true, contribution: null` in each such row, meaning
# "measured, never scored" (not "scored and contributed zero"). Added 2026-09-16.
#
# A row with `skipped: true` is a dimension NOT recorded on BOTH paths (a_val/b_val
# show whichever side IS recorded): it contributes nothing to the score, and is
# neither a difference nor a match. Unknown is not independent. Added 2026-09-19.
dimension_detail: []

independence_score: null  # 0.0–1.0 over dimensions recorded on BOTH paths; written by hook; null when none is
independence_tier: null   # UNKNOWN (coverage <0.5, PROVISIONAL) | HIGH (≥0.7) | MEDIUM (0.4–0.69) | LOW (<0.4)
evidence_coverage: null   # 0.0–1.0: share of total dimension WEIGHT recorded on both paths; written by hook

# Optional, human-filled (NOT computed by independence_scorer.py):
artifact_hash: null       # sha256 of the artifact this independence claim is ABOUT,
                           # so a later copy can be shown to be the same object
                           # (Gate 1 / Artifact Identity convention)
result: null               # what path_a and path_b each concluded — fill once both
                           # verifications have actually run, to record whether
                           # independent verification agreed or disagreed

notes: ""
