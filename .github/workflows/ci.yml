name: Tests

# WHY: opt into Node.js 24 now — GitHub Actions forces it on June 2, 2026.
# Without this, actions/checkout@v4 and actions/setup-python@v5 run on
# deprecated Node.js 20 which will break CI after June 2.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# WHY (F-11, security audit 2026-07-12): no explicit permissions block means
# GITHUB_TOKEN gets whatever the org/repo default is -- which can be broad
# ("read and write" is a common org-level default) even though this workflow
# only checks out code, lints, tests, and uploads artifacts. None of that
# needs write access to repo contents, issues, or PRs. Scoping to the
# minimum here follows GitHub's own token-hardening guidance and closes the
# gap without changing any job's actual behavior.
permissions:
  contents: read

# WHY (B4, Boyko Agent dogfood audit 2026-07-18): with no explicit shell
# configured, GitHub Actions' unspecified default `run:` shell does NOT carry
# `pipefail` -- only an explicit `shell: bash` does (bash --noprofile --norc
# -eo pipefail {0}). Verified by grep: this file previously had zero
# `shell:`/`pipefail`/`set -e`/`defaults:` entries except the one Windows
# step's `shell: pwsh`. That meant a handful of piped commands (e.g. `pytest
# ... | tail -1 | grep -oP ...`, `find ... | sort`) silently returned the
# LAST command's exit code, not the pipeline's -- a failure earlier in the
# pipe could go undetected. Setting this once, workflow-wide, fixes the whole
# class instead of patching the two instances found so far; it does not
# affect windows-install's own `shell: pwsh` step, since an explicit
# step-level shell always overrides this default.
defaults:
  run:
    shell: bash

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # WHY: weekly eval on Monday 06:00 UTC — catches config drift without
    # burning API credits on every push. Manual trigger via workflow_dispatch
    # for on-demand quality checks.
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      # WHY SHA-pinned, not @v4 (MEDIUM, external security audit 2026-07-07):
      # a tag can be moved to point at a different commit; a commit SHA
      # cannot. SHA verified live against api.github.com/repos/actions/checkout
      # on 2026-07-07 -- comment notes the tag it resolved to for readability.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # WHY: affected-only diff requires full history; default depth=1 makes HEAD~1 unavailable
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # WHY -r requirements.txt (not a hardcoded list): the hardcoded list
        # ignored requirements.txt's version pins entirely, installing
        # whatever "latest" each tool resolved to on the run date. That let
        # ruff/mypy releases change lint/type behavior and break CI with no
        # code change to point to. requirements.txt is now pinned exact and
        # is the single source of truth for CI's toolchain.
        run: pip install -r requirements.txt

      - name: Lint (ruff) — full repo
        run: ruff check .

      - name: Lint (ruff) — vendored skill scripts, correctness-only
        # WHY a separate, deliberately narrower job (P1, external audit
        # 2026-07-24): skills/*/scripts/ is excluded from the main ruff step
        # (pyproject.toml [tool.ruff] exclude) because it's vendored payloads
        # from external repos (agent-research-skills, wshobson/agents) --
        # applying this repo's own style rules would churn on every batch
        # import of code we don't own. The audit correctly flagged that this
        # left the directory with ZERO verification of any kind, not just
        # zero style enforcement. Investigated the actual gap before building
        # anything: `python -m compileall skills/core skills/extensions`
        # found 0 syntax errors, and the isolated (config-bypassing) default
        # ruff ruleset found 51 findings, all cosmetic (F541 f-string-no-
        # placeholder x22, E741 ambiguous-name x11, F841 unused-local x10,
        # F401 unused-import x7, E731 lambda-assignment x1) -- zero
        # undefined-name (F821) or redefinition (F811) bugs. So the original
        # exclusion's own rationale holds: this vendored code isn't broken,
        # it's just not styled our way, and reformatting it would be exactly
        # the churn-on-every-import problem the exclusion was written to
        # avoid. This step closes the real gap (verify it ISN'T broken)
        # without reopening that one (don't restyle code we don't own):
        # E9 (syntax errors), F821 (undefined name), F811 (redefinition).
        run: ruff check skills/core skills/extensions --isolated --select=E9,F821,F811

      - name: Type check (mypy)
        run: mypy --ignore-missing-imports hooks/ scripts/

      - name: Check dependency vulnerabilities (pip-audit)
        # WHY (2026-08-31): requirements.txt is pinned exact (see "Install
        # dependencies" above), but nothing verified those exact pins are
        # free of known CVEs against the PyPA Advisory Database. Added after
        # a bottleneck-swarm evaluation of this workflow flagged it as a
        # cheap, real gap.
        # WHY --ignore-vuln PYSEC-2026-1845 (verified live via osv.dev the
        # same day): pytest 8.4.2's only current finding, CVSS 6.8 Medium --
        # predictable /tmp/pytest-of-{user} directory naming on UNIX, fixed
        # in pytest 9.0.3. Real but low-relevance here: exploitation needs a
        # shared multi-user UNIX box with local shell access, which neither
        # this project's ephemeral GitHub-hosted CI runners nor the
        # maintainer's own single-user Windows machine are. pytest 8->9 is a
        # major-version bump across 2800+ tests -- deliberately NOT bundled
        # into this same-day CI-hardening change; upgrading and re-verifying
        # the suite is its own separate task. Remove this ignore once that
        # upgrade lands.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1845

      - name: Detect changed areas
        id: changes
        run: |
          # WHY: git diff --name-only produces multiline output that breaks
          # GITHUB_OUTPUT key=value format. Only write boolean flags per area.
          CHANGED=$(git diff --name-only ${{ github.event.before || 'HEAD~1' }} HEAD 2>/dev/null || echo "all")
          if echo "$CHANGED" | grep -q "^hooks/";     then echo "hooks=true"     >> $GITHUB_OUTPUT; fi
          if echo "$CHANGED" | grep -q "^agents/";    then echo "agents=true"    >> $GITHUB_OUTPUT; fi
          if echo "$CHANGED" | grep -q "^skills/";    then echo "skills=true"    >> $GITHUB_OUTPUT; fi
          if echo "$CHANGED" | grep -q "^claude-md/"; then echo "claude-md=true" >> $GITHUB_OUTPUT; fi

      - name: Run targeted tests
        run: |
          if [ "${{ steps.changes.outputs.hooks }}" = "true" ]; then
            echo "Running hook tests..."
            # WHY: hardcoded globs fail with exit 4 when files missing
            HOOK_TESTS=$(find tests/ -name "test_*.py" -type f | sort)
            if [ -n "$HOOK_TESTS" ]; then pytest $HOOK_TESTS -q --tb=short; fi
          fi
          if [ "${{ steps.changes.outputs.agents }}" = "true" ]; then
            echo "Running agent structure tests..."
            # WHY (F-11, security audit 2026-07-12): the previous blanket
            # `|| true` swallowed a genuine test FAILURE (exit 1) the same
            # way it swallowed the "no tests matched -k agent" case (exit 5)
            # -- the latter is a harmless edge case (e.g. the one matching
            # test gets renamed), the former is a real regression this step
            # exists to catch. `Run pytest with coverage` below already runs
            # the full suite and would still fail the job either way, but
            # this step should fail loudly at its own point of detection
            # rather than rely on that later step's duplicate coverage.
            # Also dropped `2>/dev/null` -- suppressing stderr hid the actual
            # pytest failure output needed to diagnose it here.
            pytest tests/test_structure.py -q --tb=short -k "agent" || {
              rc=$?
              if [ "$rc" -eq 5 ]; then
                echo "No agent-tagged tests collected -- skipping."
              else
                exit "$rc"
              fi
            }
          fi

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --cov=hooks --cov=scripts --cov-report=term-missing
          # WHY: threshold raised from 45% → 75% after coverage grew to 81% (972 tests).
          # 75% gives ~6% headroom for new hooks before CI fires.
          python -m coverage report --fail-under=75

      - name: Report security-critical reliability vector
        # WHY (Frontier Agent Engineering 2026 gap analysis, 2026-09-02):
        # "never average away a catastrophic safety dimension with a high
        # helpfulness score" -- the step above already fails the job on ANY
        # test failure, security-marked or not, so this adds no new
        # enforcement. It DOES make the security-critical count a separate,
        # named line in CI output instead of an invisible fraction hidden
        # inside "2934 passed" -- see scripts/reliability_vector.py.
        run: python scripts/reliability_vector.py --check

      - name: Run experiment test suites
        # WHY: `pytest tests/` above does not discover experiments/*/scripts/test_*.py --
        # an external audit (2026-07-27) caught that a real go/no-go statistics bug
        # (score_pilot.py's paired permutation test + leave-one-out) had passing local
        # tests that CI never actually ran. Generic glob so this covers every current
        # and future experiment's tests, not just one hardcoded path.
        run: |
          shopt -s nullglob
          EXPERIMENT_TESTS=(experiments/*/scripts/test_*.py)
          if [ ${#EXPERIMENT_TESTS[@]} -gt 0 ]; then
            pytest "${EXPERIMENT_TESTS[@]}" -v
          else
            echo "No experiment test suites found -- nothing to run."
          fi

      - name: Verify architectural coherence
        # WHY: the declared architecture (skills/registry.yaml capability contracts +
        # architecture/workflows/*.yaml) must stay machine-consistent -- every workflow step
        # resolves to a real skill+capability, the requires-graph is acyclic, no dangling
        # references, verifiers/termination present. A declarative-only guarantee drifts;
        # this makes it executable. See docs/architecture-coupling + scripts/check_architecture.py.
        run: python scripts/check_architecture.py --check

      - name: Verify new/modified skills declare a capability contract
        # WHY: architecture/capability.schema.json documents that adoption is
        # "evolutionary, not big-bang" -- check_architecture.py's own
        # gate_capability_schema already validates every EXISTING capability
        # block, but nothing stopped coverage from staying frozen forever,
        # since no gate required a NEWLY added or touched wired/dogfooded
        # skill to declare one at all. This gate is regression-only: it diffs
        # skills/registry.yaml against origin/main and only flags a skill
        # that is new or modified in this diff, never the ~119 pre-existing
        # entries that were never touched. Fails open (exit 0, warning) if
        # origin/main cannot be resolved, rather than blocking an unrelated
        # PR on an infra gap this gate cannot itself fix.
        run: python scripts/check_capability_completeness.py --check

      - name: Verify doc counts (single source of truth) match filesystem
        if: matrix.python-version == '3.12'
        # WHY this step runs the script directly (added 2026-07-24, external
        # audit): scripts/sync_doc_counts.py IS the single source of truth for
        # every structural count (hooks/agents/skills/rules/events) across
        # README, architecture.md, plugin.json, both marketplace.json, CITATION.cff
        # and AGENTS.md -- but CI previously only had a SEPARATE bash check_pattern
        # loop that covered a subset and never touched CITATION.cff/AGENTS.md.
        # Those two files drifted the furthest precisely because nothing enforced
        # them. Running --check here makes the authoritative script the gate, so
        # any new anchor added to it is enforced automatically without also
        # hand-editing this workflow.
        run: python scripts/sync_doc_counts.py --check

      - name: Verify hook control matrix matches registry.yaml
        if: matrix.python-version == '3.12'
        # WHY (external audit 2026-08-14): docs/hook-control-matrix.md is
        # GENERATED from hooks/registry.yaml + hooks/settings.json, not
        # hand-maintained -- same drift risk sync_doc_counts.py already
        # guards against for the plain counts, applied to the wired/dormant/
        # library/prevent-warn-observe breakdown specifically.
        run: python scripts/gen_hook_matrix.py --check

      - name: Verify experiment graph + index integrity
        if: matrix.python-version == '3.12'
        # WHY this step exists at all (PR D, 2026-09-12): scripts/
        # check_experiment_graph.py shipped in PR #444 and was never wired into CI,
        # so it only ran when somebody remembered to invoke it by hand -- i.e. it
        # protected nothing automatically. That is the same defect class the
        # experiment it came from was measuring, committed by the cycle doing the
        # measuring.
        #
        # WHAT it now gates beyond the original graph.yaml/sealed_holdout.yaml
        # checks: the index invariant -- an experiment that exists must be
        # discoverable. The established protocol for not repeating dead ends is
        # "grep experiments/INDEX.md before starting work", which can only surface
        # what somebody remembered to index; on this repository's own history that
        # left FIVE experiments invisible to it, including both cycles that were
        # themselves working on experiment tracking. Same invariant the "Registry
        # <-> disk consistency gate" already enforces for skills, extended to
        # experiments.
        run: python scripts/check_experiment_graph.py --check

      - name: Verify plugin hooks.json matches settings.json
        if: matrix.python-version == '3.12'
        # WHY (P0-C, external audit 2026-07-24): hooks/hooks.json (the plugin
        # manifest's hook config, required at `hooks/hooks.json` per Claude
        # Code's plugin spec) is GENERATED from hooks/settings.json by
        # scripts/sync_plugin_hooks.py -- never hand-edited. Without this gate,
        # someone editing settings.json (adding/removing a hook) would silently
        # leave hooks.json stale, and `/plugin install` would wire the WRONG set
        # of hooks. Confirmed live this session: `claude plugin install` copies
        # hooks.json + all 128 skills into the plugin cache verbatim.
        run: python scripts/sync_plugin_hooks.py --check

      - name: Verify README metrics match reality
        if: matrix.python-version == '3.12'
        run: |
          # WHY: External audit found README metrics drifting from actual values.
          # This step ensures Evidence Policy applies to our own README.
          #
          # WHY README_TESTS/README_COV (and TEXT_TESTS/TEXT_COV below) end in
          # `|| true` but ACTUAL_TESTS does NOT (B4 pipefail regression, found
          # live on this same PR after the defaults:run:shell:bash fix): these
          # grep calls are allowed to legitimately find no match -- their
          # absence is what the `if [ -n ... ]` / equality checks below exist
          # to report, with a clear ::error:: message. Under this workflow's
          # new pipefail, grep's own exit 1 on "no match" would otherwise abort
          # the whole step right here with no error message at all, before any
          # of that reporting logic runs -- confirmed by reproducing it locally
          # (`grep -oP '...tests\*\*' README.md` legitimately finds nothing when
          # the text-summary line's wording doesn't match, aborting the script
          # silently). ACTUAL_TESTS is deliberately left WITHOUT `|| true`: its
          # pipe is the one B4 specifically hardened (a failing pytest run
          # whose tail still contains stale "N passed" text must still surface
          # as a failure), and this repo's real suite never legitimately
          # produces a "no match" case for it.
          ACTUAL_TESTS=$(pytest tests/ -q --no-header 2>/dev/null | tail -1 | grep -oP '\d+(?= passed)')
          ACTUAL_COV=$(python -m coverage report | tail -1 | grep -oP '\d+(?=%)')
          README_TESTS=$(grep -oP 'Tests-\K\d+' README.md | head -1 || true)
          README_COV=$(grep -oP 'Coverage-\K\d+' README.md | head -1 || true)

          echo "Actual: ${ACTUAL_TESTS} tests, ${ACTUAL_COV}% coverage"
          echo "README: ${README_TESTS} tests, ${README_COV}% coverage"

          # WHY tolerance on coverage (not on test count): investigated 2026-09-08
          # after PR #392/#393 each showed 85% then 84% across two CI runs of the
          # SAME commit, test count unchanged. Reproduced locally (10 back-to-back
          # `pytest --cov` runs on one commit): the true value sits at ~84.57-84.59%,
          # right on coverage.py's rounding boundary, and swings by 1-4 statements
          # out of ~10.5k run-to-run. Root cause isolated to hooks/doc_registry.py's
          # `_load()`/`_save()` error-handling branches (and the same pattern in
          # expert_registry.py/vector_store.py/moc_autolink.py): their own
          # concurrency regression tests deliberately use real threading.Thread +
          # real file I/O to catch genuine Windows os.replace() races (by design --
          # see tests/test_doc_registry.py's docstring), so whether the defensive
          # `except Exception` branch gets hit depends on real OS thread-scheduling
          # timing, not on any code change. Eliminating that non-determinism would
          # mean stripping real concurrency out of tests that exist specifically to
          # catch real races -- not worth it for a badge check. Test count has no
          # such source of non-determinism (grep on a fixed "N passed" line) and
          # stays an exact match.
          #
          # TRADEOFF, stated explicitly: the measured swing is ~0.02pp (1-4
          # statements), but 1 is the tightest integer tolerance that can absorb
          # a rounding flip between adjacent integers, so this also silently
          # accepts a genuine ~1pp regression, not just rounding flicker. The
          # more surgical fix (`# pragma: no cover` on the specific flaky
          # except-branches) would remove the non-determinism at the source and
          # let this stay an exact match -- left as a follow-up, out of scope
          # for this single-file CI gate change.
          COV_TOLERANCE=1

          FAIL=0
          if [ "$ACTUAL_TESTS" != "$README_TESTS" ]; then
            echo "::error::README badge claims ${README_TESTS} tests but actual is ${ACTUAL_TESTS}"
            FAIL=1
          fi
          COV_DIFF=$(( ACTUAL_COV > README_COV ? ACTUAL_COV - README_COV : README_COV - ACTUAL_COV ))
          if [ "$COV_DIFF" -gt "$COV_TOLERANCE" ]; then
            echo "::error::README badge claims ${README_COV}% coverage but actual is ${ACTUAL_COV}% (diff ${COV_DIFF}pp > ${COV_TOLERANCE}pp tolerance)"
            FAIL=1
          fi

          # WHY: Codex audit found badges updated but text summary still stale.
          # Check that ALL test/coverage mentions in README match actual values.
          #
          # CORRECTION 2026-09-10: that sentence described the INTENT, not the
          # code. The old check grepped exactly one shape -- bold `**N tests**`
          # -- and then took `head -1`, so a plain-text mention was structurally
          # invisible to it. Two such mentions (a comparison-table cell and the
          # file-tree line) sat at 3125 while the badge said 3298, stale since
          # 2026-09-05 (73c674c), on the front page of a repo whose own thesis
          # is that published claims must match measured reality.
          #
          # The fix enumerates EVERY test-count-shaped number instead of adding
          # a third pattern: `Tests-<N>` (badge) plus `<N> tests` in any markup,
          # deduplicated, each compared to ACTUAL_TESTS. A mention added later
          # in a shape nobody anticipated is gated automatically.
          #
          # WHY the {3,5} bound: it keeps a small local count ("3 tests cover
          # this branch") from being mistaken for the suite total. If a genuine
          # 3-5 digit non-total ever appears next to the word "tests", this gate
          # will flag it -- rewrite that sentence rather than widening the
          # pattern back out.
          #
          # Coverage is deliberately NOT converted the same way in this change:
          # every coverage mention needs the +-1pp tolerance comparison below,
          # not equality, so folding it in is a separate change with its own
          # reasoning. One fix per PR.
          ALL_TEST_NUMS=$(grep -oP 'Tests-\K\d{3,5}|\d{3,5}(?=\s+tests\b)' README.md | sort -u || true)
          for N in $ALL_TEST_NUMS; do
            if [ "$N" != "$ACTUAL_TESTS" ]; then
              echo "::error::README mentions ${N} tests but actual is ${ACTUAL_TESTS}"
              FAIL=1
            fi
          done
          TEXT_TESTS=$(grep -oP '\*\*\K\d+(?=\s+tests\*\*)' README.md | head -1 || true)
          TEXT_COV=$(grep -oP '\*\*\K\d+(?=%\*\*)' README.md | head -1 || true)
          if [ -n "$TEXT_TESTS" ] && [ "$TEXT_TESTS" != "$ACTUAL_TESTS" ]; then
            echo "::error::README text says **${TEXT_TESTS} tests** but actual is ${ACTUAL_TESTS}"
            FAIL=1
          fi
          if [ -n "$TEXT_COV" ]; then
            TEXT_COV_DIFF=$(( ACTUAL_COV > TEXT_COV ? ACTUAL_COV - TEXT_COV : TEXT_COV - ACTUAL_COV ))
            if [ "$TEXT_COV_DIFF" -gt "$COV_TOLERANCE" ]; then
              echo "::error::README text says **${TEXT_COV}%** coverage but actual is ${ACTUAL_COV}% (diff ${TEXT_COV_DIFF}pp > ${COV_TOLERANCE}pp tolerance)"
              FAIL=1
            fi
          fi
          exit $FAIL

      - name: Verify doc counts match filesystem
        if: matrix.python-version == '3.12'
        run: |
          # utils.py + severity_calibrator.py + hook_state.py are shared libraries, not counted hooks
          # (severity_calibrator = RFC-003 step 3, not wired until shadow mode = step 5;
          # hook_state = HookState class imported by commit_test_gate/iteration_guard, no
          # stdin/stdout hook protocol -- same exclusion rationale as utils.py).
          # WHY this list must match hooks/registry.yaml's own EXCLUDED section: this line
          # previously omitted hook_state.py, so ACTUAL_HOOKS (89) drifted one above
          # registry.yaml's protocol_hook count (88) -- CI was gating README/architecture.md
          # against an inflated number instead of catching the real drift.
          ACTUAL_HOOKS=$(ls hooks/*.py | grep -v utils.py | grep -v severity_calibrator.py | grep -v hook_state.py | grep -v __pycache__ | wc -l)
          # WHY exclude CLAUDE.md: agents/CLAUDE.md is the agents/ local-rules doc
          # (no YAML frontmatter, not invocable via the Agent tool), not an agent
          # definition. Found 2026-07-17 (adversarial pre-audit pass): this count
          # previously included it (plus a since-removed stale agents/_README.md
          # duplicate), inflating 13 real agents to 14/15 depending on which repo
          # state was measured -- the exact same bug class as the hooks count above.
          ACTUAL_AGENTS=$(ls agents/*.md | grep -v CLAUDE.md | wc -l)
          # WHY: skills count = SKILL.md files under skills/ (core + extensions).
          # This is the only filesystem-grounded definition; used to gate the
          # plugin.json / marketplace.json descriptions (previously ungated → drifted).
          ACTUAL_SKILLS=$(find skills -name SKILL.md | wc -l)
          # WHY find and not `ls rules/*.md` (fixed 2026-09-09): rules/ gained
          # its first nested directory (rules/pearl_registry/) in #407, and the
          # flat glob silently stopped counting one shipped rule file from that
          # commit on. This gate is the real enforcement point, and it carried
          # the same blind spot as scripts/sync_doc_counts.py -- so the two
          # agreed with each other while both were wrong. Matches ACTUAL_SKILLS
          # above, which has been recursive since it was written.
          ACTUAL_RULES=$(find rules -name '*.md' | wc -l)
          ACTUAL_CORE_SKILLS=$(find skills/core -maxdepth 1 -mindepth 1 -type d | wc -l)
          ACTUAL_EXT_SKILLS=$(find skills/extensions -maxdepth 1 -mindepth 1 -type d | wc -l)
          echo "Actual: ${ACTUAL_HOOKS} hooks, ${ACTUAL_AGENTS} agents, ${ACTUAL_SKILLS} skills, ${ACTUAL_RULES} rules, ${ACTUAL_CORE_SKILLS} core, ${ACTUAL_EXT_SKILLS} ext"

          # Check architecture.md
          # WHY `|| true` (same B4 pipefail regression as the README step
          # above): "not found" is a valid, checkable outcome here, not a
          # script-abort condition -- the equality checks below already
          # report a clear ::error:: for it.
          ARCH_AGENTS=$(grep -oP '\d+(?= agents)' docs/architecture.md | head -1 || true)
          ARCH_HOOKS=$(grep -oP '\d+(?= hooks)' docs/architecture.md | head -1 || true)
          FAIL=0
          if [ "$ARCH_AGENTS" != "$ACTUAL_AGENTS" ]; then
            echo "::error::architecture.md says ${ARCH_AGENTS} agents but actual is ${ACTUAL_AGENTS}. Fix: python scripts/sync_doc_counts.py"
            FAIL=1
          fi
          if [ "$ARCH_HOOKS" != "$ACTUAL_HOOKS" ]; then
            echo "::error::architecture.md says ${ARCH_HOOKS} hooks but actual is ${ACTUAL_HOOKS}. Fix: python scripts/sync_doc_counts.py"
            FAIL=1
          fi

          # WHY: After [AVOID×4] recurrence, README TOTAL-counter mentions
          # (in hero, comparison table, badges, section headers, docs links)
          # were drifting independently of the Tests/Coverage badges checked above.
          # Scan only patterns that unambiguously claim a TOTAL — not category
          # counts like "12 PreToolUse hooks" or "4 agents with memory".
          # Use sed with capture group to extract ONLY the count, not all digits
          # (grep -oP greedy bug: would catch '2' and '3' inside "%2B_3_teams").

          check_pattern() {
            local label="$1" actual="$2" sed_expr="$3"
            local found
            found=$(sed -nE "s|$sed_expr|\1|p" README.md | sort -u)
            for n in $found; do
              if [ "$n" != "$actual" ]; then
                echo "::error::README pattern '$label' has '${n}' but actual is ${actual}"
                FAIL=1
              fi
            done
          }

          # Hook TOTAL patterns (must == ACTUAL_HOOKS)
          check_pattern "hooks badge"         "$ACTUAL_HOOKS" '.*hooks-([0-9]+)_guards.*'
          check_pattern "Backed-by hero"      "$ACTUAL_HOOKS" '.*Backed by ([0-9]+) hooks.*'
          check_pattern "profile-table hooks" "$ACTUAL_HOOKS" '.*\+ ([0-9]+) hooks \+.*'
          check_pattern "section header"      "$ACTUAL_HOOKS" '.*## ([0-9]+) Hooks.*'
          check_pattern "all-hooks docs link" "$ACTUAL_HOOKS" '.*All ([0-9]+) hooks with examples.*'
          check_pattern "hooks-defined"       "$ACTUAL_HOOKS" '.*badge/([0-9]+)_hooks-defined.*'

          # Agent TOTAL patterns (must == ACTUAL_AGENTS)
          check_pattern "agents badge"        "$ACTUAL_AGENTS" '.*agents-([0-9]+)_%2B_3_teams.*'
          check_pattern "Backed-by agents"    "$ACTUAL_AGENTS" '.*Backed by [0-9]+ hooks · ([0-9]+) agents.*'
          check_pattern "profile-table agents" "$ACTUAL_AGENTS" '.*\+ ([0-9]+) agents \+.*'
          check_pattern "compare-table agents" "$ACTUAL_AGENTS" '.*\| ([0-9]+) agents \+ 3 squads.*'

          # Skills TOTAL patterns (must == ACTUAL_SKILLS)
          # WHY (2026-07-17): these 2 lines drifted to "123 skills" while actual was
          # 125 (2 new skills added) -- caught only by CI's check_meta loop below
          # failing on the 3 json files, NOT by any README-side gate, because no
          # such gate existed for these 2 mentions. Same "adjective/rephrase evades
          # the pattern" risk as the hooks/agents patterns above -- these are the
          # missing "Skills TOTAL" counterpart to those two sections.
          check_pattern "compare-table skills" "$ACTUAL_SKILLS" '.*agents \+ 3 squads · ([0-9]+) skills.*'
          check_pattern "profile-table skills" "$ACTUAL_SKILLS" '.*all ([0-9]+) skills.*'

          # WHY (2026-06-12): README file-tree section (├── rules/ N ...) was ungated
          # and drifted to stale counts (8/56/14/9/40 vs actual 14/60/15/12/102).
          # These patterns were found manually by an analyst — now gated so CI catches drift.
          check_pattern "file-tree rules"       "$ACTUAL_RULES"       '.*rules/[[:space:]]+([0-9]+) modular.*'
          # WHY "hooks", not "Python" (Boyko Agent dogfood audit 2026-07-18):
          # README's file-tree line was reworded from "56 Python guards (52
          # hooks + 4 support libs)" to "N hooks + utils.py/... (shared libs)"
          # back in commit a58b215 -- long before this session -- but this
          # pattern was never updated to match. It has captured zero lines
          # ever since, silently ungating this exact count the whole time
          # (tool-verified: `sed -nE 's|.*hooks/[[:space:]]+([0-9]+) Python.*|\1|p' README.md`
          # returns nothing against the current file). Same evasion class as
          # check_meta's B3 finding, just via a wording change instead of an
          # inserted adjective.
          check_pattern "file-tree hooks"       "$ACTUAL_HOOKS"       '.*hooks/[[:space:]]+([0-9]+) hooks.*'
          check_pattern "file-tree agents"      "$ACTUAL_AGENTS"      '.*agents/[[:space:]]+([0-9]+) active.*'
          check_pattern "file-tree core-skills" "$ACTUAL_CORE_SKILLS" '.*core/[[:space:]]+([0-9]+) universal.*'
          check_pattern "file-tree ext-skills"  "$ACTUAL_EXT_SKILLS"  '.*extensions/[[:space:]]+([0-9]+) domain.*'

          # WHY (PR: close audit gap): plugin.json + marketplace.json descriptions
          # embed "N hooks, M agents, K skills" and were NOT gated → drifted to
          # 56/14/40 and 49/14/26 while actual was 60/15/71. Gate all three counts
          # in both files against the same filesystem actuals used above.
          #
          # WHY (external audit 2026-07-16, drift found at 87 vs 88 hooks): this
          # loop originally listed only 2 of the repo's 3 metadata files. There are
          # TWO marketplace.json files -- root (secondary) and .claude-plugin/
          # (the canonical plugin-system location) -- and only the root one was
          # gated, so .claude-plugin/marketplace.json drifted silently to 87.
          # A count is only defended if EVERY file that states it is in this list.
          check_meta() {
            local file="$1" kind="$2" actual="$3"
            local found
            # WHY the "[0-9]+ (word ){0,2}${kind}" shape, case-insensitive
            # (B3, Boyko Agent dogfood audit 2026-07-18): the ORIGINAL audit
            # found the drifted file phrased it "87 deterministic hooks",
            # which a plain "[0-9]+ hooks" pattern does not match -- allowing
            # exactly one interstitial word fixed that specific rephrase.
            # But a live-tested follow-up found the one-word allowance is
            # itself the same evasion one word further: "87 core deterministic
            # hooks" (two words) still produced zero matches, confirmed with
            # `grep -oE` against realistic two-word phrasings before this fix.
            # Widened to allow up to two interstitial words, and added -i so a
            # capitalized adjective (e.g. "Core") cannot evade it the same
            # way. This remains a bounded, reactive fix, not a structural one
            # -- a THREE-word rephrase would still evade it. A more durable
            # fix would anchor on line/field structure instead of adjective
            # count, but that is a larger change than this pass covers.
            # WHY `|| true` (B4 pipefail regression, found live on this same
            # PR): a file mentioning zero instances of "${kind}" is a valid,
            # tolerated case -- the `for n in $found` loop below already
            # handles an empty $found correctly by simply not iterating.
            # Without this, pipefail+errexit would abort the whole script the
            # moment any one of the 3 metadata files happens not to mention a
            # given kind at all, rather than just skipping that check for it.
            found=$(grep -ioE "[0-9]+ ([a-z]+ ){0,2}${kind}" "$file" | grep -oE "^[0-9]+" | sort -u || true)
            for n in $found; do
              if [ "$n" != "$actual" ]; then
                echo "::error::${file} says ${n} ${kind} but actual is ${actual}"
                FAIL=1
              fi
            done
          }
          for meta_file in .claude-plugin/plugin.json .claude-plugin/marketplace.json marketplace.json; do
            check_meta "$meta_file" "hooks"  "$ACTUAL_HOOKS"
            check_meta "$meta_file" "agents" "$ACTUAL_AGENTS"
            check_meta "$meta_file" "skills" "$ACTUAL_SKILLS"
          done

          exit $FAIL

      - name: Registry ↔ disk consistency gate
        if: matrix.python-version == '3.12'
        run: |
          # WHY: catches orphan skills (SKILL.md on disk, no registry entry) and
          # ghost skills (registry entry, no SKILL.md on disk) before they accumulate.
          # Defect-class seen in audit 2026-06-10: 7 skills added to disk, registry
          # not updated → skill-manager.sh couldn't find them.
          FAIL=0

          # Disk: skill directory names under skills/core and skills/extensions
          DISK_SKILLS=$(find skills/core skills/extensions -maxdepth 1 -mindepth 1 -type d \
            -exec basename {} \; 2>/dev/null | sort)

          # Registry: skill names listed under core:/extensions:/community: sections
          REGISTRY_SKILLS=$(grep -A1 '  - name:' skills/registry.yaml | \
            grep -v '\-\-' | grep 'name:' | sed 's/.*name: *//' | sort)

          # Orphans: on disk but not in registry
          ORPHANS=$(comm -23 \
            <(echo "$DISK_SKILLS") \
            <(echo "$REGISTRY_SKILLS"))

          # Ghosts: in registry but no disk directory
          GHOSTS=$(comm -13 \
            <(echo "$DISK_SKILLS") \
            <(echo "$REGISTRY_SKILLS"))

          if [ -n "$ORPHANS" ]; then
            echo "::error::Orphan skills (disk directory exists, no registry entry):"
            echo "$ORPHANS" | while read -r s; do echo "  - $s"; done
            FAIL=1
          fi

          if [ -n "$GHOSTS" ]; then
            echo "::warning::Ghost skills (registry entry, no disk directory):"
            echo "$GHOSTS" | while read -r s; do echo "  - $s"; done
            # warning only — some registry entries are .md references without directories
          fi

          if [ $FAIL -eq 0 ]; then
            echo "Registry ↔ disk: OK ($(echo "$DISK_SKILLS" | wc -l) skills consistent)"
          fi
          exit $FAIL

      - name: Run smoke tests
        run: bash tests/test_all.sh

      - name: Validate Python syntax
        run: |
          for f in hooks/*.py scripts/*.py; do
            python -c "import py_compile, sys; py_compile.compile(sys.argv[1], doraise=True)" "$f"
          done

      - name: Check no secrets in tracked files
        run: |
          if grep -rE "(sk-[a-zA-Z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{36,})" \
            --include="*.py" --include="*.md" --include="*.json" --include="*.sh" \
            --exclude="*test_redact*" --exclude="*test_*" \
            .; then
            echo "::error::Potential secret found in tracked files!"
            exit 1
          fi

      - name: Check no author-specific paths in templates
        run: |
          if grep -rF "C:/Users/sboi" --include="*.md" --include="*.json" --include="*.ps1" --include="*.sh" --exclude-dir=tests .; then
            echo "::error::Author-specific path leaked into tracked files!"
            exit 1
          fi

      # WHY: notebooklm skill creates SKILL_DIR/data/ (Google auth state,
      # browser cookies, session pointer) and SKILL_DIR/.venv/ (500MB
      # chromium binaries) on first run. If a developer runs the skill
      # from within the repo clone and then `git add -A`, these would be
      # staged. .gitignore catches them — but defence in depth: this CI
      # step fails the PR if any of these paths reach the tracked tree,
      # even if .gitignore is later weakened.
      - name: Check no skill runtime artifacts tracked
        run: |
          FAIL=0
          # Tracked files that match high-risk patterns:
          BAD_FILES=$(git ls-files | grep -E '(skills/(extensions|core)/[^/]+/(data|\.venv)/|/auth_info\.json$|/browser_state/|/state\.json$|/sessions\.json$)' || true)
          if [ -n "$BAD_FILES" ]; then
            echo "::error::Skill runtime artifacts found in tracked files (auth tokens, browser state, venvs should never be committed):"
            echo "$BAD_FILES"
            FAIL=1
          fi
          exit $FAIL

  eval:
    runs-on: ubuntu-latest
    # WHY: eval uses claude -p (real API calls, costs money, non-deterministic).
    # Only runs on manual trigger or weekly schedule — never on every push/PR.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: test

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install claude CLI
        # WHY unpinned (deliberate, not the same class of risk as F-01's
        # third-party clone): this is Anthropic's own first-party package,
        # this job never blocks push/PR (workflow_dispatch/schedule only,
        # continue-on-error: true), and the eval's actual purpose is to
        # catch config drift against the CURRENT Claude Code release --
        # pinning to a fixed version would work against that goal.
        run: npm install -g @anthropic-ai/claude-code

      - name: Run eval framework
        id: run_eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # WHY: continue-on-error=true — eval failures are informational, not
        # blockers. The eval job reports quality drift without blocking releases.
        # The "Flag eval outcome" step below makes a script crash/failure VISIBLE
        # in the Actions UI despite this -- a prior version had this masking a
        # real script bug (run_eval.sh's `((FAILED++))` dying under `set -e` on
        # the very first result) as a silent green checkmark. continue-on-error
        # alone is not the bug; continue-on-error with no failure signal is.
        continue-on-error: true
        run: bash tests/eval/run_eval.sh --verbose

      - name: Flag eval outcome
        if: always()
        run: |
          if [ "${{ steps.run_eval.outcome }}" != "success" ]; then
            echo "::warning title=Eval framework failed::run_eval.sh exited non-zero (outcome=${{ steps.run_eval.outcome }}). This job is non-blocking by design, but the failure is real -- check the eval-results artifact."
            echo "### :warning: Eval framework failed (outcome=${{ steps.run_eval.outcome }})" >> "$GITHUB_STEP_SUMMARY"
            echo "This job is non-blocking by design, but the failure is real. Check the \`eval-results\` artifact." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-results-${{ github.run_id }}
          path: tests/eval/results/

  windows-install:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run PowerShell installer smoke test
        shell: pwsh
        run: .\tests\test_install.ps1

  secrets-scan:
    runs-on: ubuntu-latest
    # WHY a dedicated job, not a step in `test` (2026-08-31, bottleneck-swarm
    # CI evaluation): gitleaks needs full git history (fetch-depth: 0) but no
    # Python/pip setup at all -- coupling it to the test job's matrix and
    # runtime would only add unrelated overhead per matrix entry.
    # WHY gitleaks specifically: the existing "Check no secrets in tracked
    # files" step (in the test job below) only matches 3 hardcoded patterns
    # (sk-/AKIA/ghp_) against the current tree. gitleaks ships a maintained,
    # much broader detection ruleset and scans full history, not just HEAD --
    # kept the narrow regex step too rather than removing it, since it's
    # cheap and catches the same 3 patterns even if this job were ever
    # disabled.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        # WHY SHA-pinned to v3.0.0 (verified live against
        # api.github.com/repos/gitleaks/gitleaks-action/tags 2026-08-31,
        # same convention as actions/checkout and actions/setup-python
        # above): v3 also opts into Node 24 ahead of GitHub's June 2026
        # forced migration, matching this file's own FORCE_JAVASCRIPT_
        # ACTIONS_TO_NODE24 rationale at the top.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # WHY no GITLEAKS_LICENSE: only required for GitHub Organization
          # accounts, not personal accounts (verified against gitleaks-
          # action's own README 2026-08-31) -- this repo is under a personal
          # account.
