# Canonical workflow: scientific-hypothesis-single
# Second canonical workflow (the first, scientific-hypothesis.yaml, called itself "the first
# machine-proven route" -- this is the deliberate second one, not scope creep).
#
# WHY this exists (audit, 2026-09-05/06): the original scientific-hypothesis workflow always ran
# claim-decomposer and sci-hypothesis, for every hypothesis, no matter how simple. Two internal
# contradictions this caused:
#   - claim-decomposer's own SKILL.md says "НЕ для: целостный анализ одной простой гипотезы
#     (-> /sci-evidence)" -- yet the only canonical route forced it in anyway.
#   - sci-hypothesis is a GENERATOR ("сгенерируй гипотезу", triggers on hypothesis GENERATION),
#     used inside a route whose own usage docstring example is "test the hypothesis that X
#     causes Y" -- testing an existing hypothesis, not generating new ones.
# boyko-scientific-consortium/SKILL.md already had the correct branch rule, at the skill-prose
# level, unenforced by any router: "Один механизм, нужна доказательная база или его нужно
# сломать -> /sci-evidence" (skip the arbiter -- nothing to arbitrate) vs "≥2 конкурирующих
# механизма -> /hypothesis-arbiter". This workflow is that first branch, finally wired into
# scripts/resolve_route.py instead of living only as prose one human has to remember to apply.
#
# WHY estimand-bridge was REMOVED from this route (audit, 2026-09-06, live-verified): the
# original version of this file kept estimand-bridge as step 2, reasoning "estimand-ops L0/L1
# applies to every hypothesis, so this step is not one of the two dropped". That reasoning
# conflated two different things. estimand-ops L0 (Descriptive/Predictive/Causal classification)
# is a lightweight judgment call -- and sci-evidence's own SKILL.md already runs it as its own
# "Шаг 0 -- EstimandOps L0 Gate (ОБЯЗАТЕЛЬНО)" (verified: grep for "EstimandOps L0" in
# skills/extensions/sci-evidence/SKILL.md). estimand-bridge is a HEAVIER, separate skill that
# reads an actual estimand.md file with materialized MCID/ICE fields, and its own SKILL.md is
# explicit: "Если estimand.md нет ... -> СТОП: <<нечего enforce-ить, сначала заполни estimand>>."
# boyko-scientific-consortium's own routing table for the single-mechanism branch (Шаг 0 -> Шаг
# 3 causal map, optional -> Шаг 5 sci-evidence) never mentions estimand-bridge at all. Keeping it
# as a hard step here meant the "fast path" would hard-STOP on its very first real invocation
# against an ad-hoc hypothesis with no experiments/<id>/estimand.md on disk -- the CI schema gate
# never catches this because it only checks capability-token satisfiability, not whether a
# skill's own runtime instructions can actually complete. Removed the step; sci-evidence's own
# L0 gate covers the estimand-ops discipline this fast path actually needs.
id: scientific-hypothesis-single
description: >
  Fast path for ONE already-specified hypothesis with a single mechanism -- FALSIFY it directly
  (sci-evidence's "5 worlds where I'm wrong"), then BUILD the evidence case if it survives, with
  no atomic decomposition or generation of competing candidates the task doesn't need. Use
  scientific-hypothesis.yaml instead when ≥2 competing mechanisms need arbitration.
task_type: scientific-hypothesis-single
risk_tier: Green   # analysis only; no irreversible side effects -> no human_checkpoint required

steps:
  - skill: routing-policy
    capability: task.route
    note: Classify the task and attach the mandatory safety floor (routing_floor_classifier).
  - skill: sci-evidence
    capability: falsification.five_worlds
    note: FALSIFY "5 worlds where I'm wrong" then BUILD "5 paths to evidence" -- one mechanism, nothing to arbitrate.
  - skill: skeptic
    capability: falsification.verdict
    note: Context-blind adversarial verifier -- the falsification gate for the whole route.

gates:
  - falsification-ladder(rule)   # FL Full ladder: controls + baseline + stress + go/no-go
  - source_trace                 # AI-generated claims must trace to a primary source
  - safety_floor_check           # mandatory floor from routing_floor_classifier

verifier: skeptic

completion:
  requires:
    - falsification_five_worlds # produced by sci-evidence
    - evidence_strength         # produced by sci-evidence
    - memory_destination        # satisfied by memory_sink below (reserved token)

failure_sink: null_results
memory_sink: experiments/
termination_condition: >
  sci-evidence has completed both the FALSIFY and BUILD passes AND skeptic verdict is one of
  {promote, reject}.
