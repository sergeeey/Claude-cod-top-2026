      claim yet, only a failure/anomaly) -- an explicit carve-out was added to the
      'claim-decomposer always first' orchestration rule to avoid silent contradiction."
    version: 1.1.0
    author: sboi
    depends_on: [claim-decomposer, sci-evidence, consilience, proof-ladder, hypothesis-arbiter, skeptic, negative-space-miner, novelty-assessment]
    description: "Роутер комплексного аудита с 6 run_modes: quick / full / math_code / contradiction / decision_record / negative_space. Оркестрирует claim-decomposer + нужные скиллы в правильном порядке (кроме negative_space — там ещё нет claim'а). Сохраняет единый контекст для Contradiction Map, параллелит только независимые проверки."
    triggers: ["/hd-mavp", "/audit-full", "/hd-mavp-router", "полный аудит утверждения", "комплексная проверка", "глубокий аудит", "выбери режим аудита"]
    tokens: ~200
