  - name: claim-decomposer
    kind: methodology
    maturity: described
    maturity_evidence: "benchmarks/claim-decomposer/run-2026-09-05-two-source-gate-claim.md
      -- n=1, 2026-09-05, real atomic decomposition of this session's own Gate 10
      two-source claim. Found a genuine additional gap beyond the prior skeptic
      review of the same claim (Math-Code Trace step showed the existing Gate 10
      parser only validates the FIRST citation target, so even the naive regex
      extension doesn't fit without a redesign) and formalized the circular-metric
      issue as a specific blocking atom-pair contradiction. Kept at 'described' not
      'dogfooded' -- this run was NOT blind (skeptic's verdict was already visible
      in the input), so apparent convergence with skeptic is not independent
      corroboration; a real dogfooded-tier run needs claim-decomposer applied
      BEFORE any skeptic review exists."
    pack: claim-pipeline
    version: 1.0.0
    author: sboi
    depends_on: []
    description: "Атомарная декомпозиция сложного утверждения: Context Lock → Claim Register → Critical Atoms → Math-Code Trace → (опц.) LogicTree формальная дедукция для цепочек >=3 импликаций → Contradiction Map → Recomposition → Gate Decision. Pre-step перед /consilience, /proof-ladder, /sci-evidence для сложных multi-atom claims."
    triggers: ["/claim-decomposer", "/decompose", "разложи утверждение", "найди противоречия в claim", "атомарный анализ", "atomic decomposition", "contradiction map", "recompose", "claim graph", "что здесь сломано"]
    tokens: ~550
    type: directory
    capability:
      provides: [claim.atoms, contradiction.map]
      risk_tier: Green
      verification_required: [skeptic]
      accepts: [route_decision]
      produces: [atomic_claims, contradiction_map]
      requires: []
      preconditions: ["a compound claim/hypothesis is stated"]
      side_effects: []
      cost: "~400 tokens"
      fallback: null
      status: stable

  - name: hd-mavp-router
    kind: orchestrator
    maturity: wired
    maturity_evidence: "2026-08-30: added negative_space run_mode (Q4 classify question,
      routes to negative-space-miner -> hypothesis-arbiter -> novelty-assessment) as
      part of harvesting a 'Negative-Space Hypothesis Miner' prompt template's genuine
