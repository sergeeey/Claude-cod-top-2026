      hypothesis-generation input -- narrow-discovery-engines Engine 1/4 work
      on the user's OWN model residuals and OWN null_results, not the field's
      published failures). Meta-audit 2026-08-31 (cross-run review of this
      file's own history, not a new dogfood run): all 5 fixes above were
      found by an independent skeptic AFTER a run, none by Stage 6 (Attack)
