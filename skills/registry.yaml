  - name: negative-space-miner
    kind: methodology
    maturity: described
    maturity_evidence: "n=1, 2026-08-30 -- real run on ego depletion / strength
      model of self-control (Baumeister 1998), with real WebSearch (not from
      memory): found the 2016 RRR null result, bias-corrected meta-analysis,
      Kurzban 2013's critique of the glucose mechanism, and the fragile Job/
      Dweck/Walton 2010 moderator (weakened by its own 2023 replication). All 9
      stages ran; the ACH matrix (Stage 7) found a genuinely cheap
      discriminating test (reanalyze archived RRR data by implicit-theory
      subgroup). Run found 2 fixes, both applied: (1) 'max 5 hypotheses' does
      not mean 'minimum 5' -- explicitly allowed fewer; (2) Novelty Check
      without delegating to /novelty-assessment caps at 'closely related', can
      never reach 'apparently novel'. Second run (2026-08-30, microbiome/obesity
      causal claim, also real WebSearch) produced a repair hypothesis that an
      INDEPENDENT skeptic agent (context-asymmetric, claim+evidence only) scored
      WEAKENED, bordering FALSIFIED-AS-STATED: a restatement of an existing
      caveat rather than a synthesis, and unfalsifiable-by-confounder-appeal.
      Not a failure of the skill -- a real execution gap the run itself
      surfaced, fixed with 2 new gates: Ruling Theory Trap gate (Stage 3, must
      explicitly reject other candidate variables before settling on one, not
      just skip checking them) and Rescue-unfalsifiability check (Stage 4, a
      Duhem-Quine qualifier that excuses ANY conceivable negative result is not
      a qualifier, it's unfalsifiability). Honest scope finding: the method
      earns its structure on objects with multiple genuinely competing
      explanations (ego depletion); on an object with one field-consensus
      explanation it added little beyond a 20-minute literature skim -- a real,
      adversarially-found boundary of applicability, not self-assessed. Same
      microbiome object re-run with both new gates (third real run,
      2026-08-30) -- a second independent skeptic audit found REAL improvement
      (3 of 5 hypotheses NEEDS-REAL-DATA with mostly tight, pre-specified
      falsifiers, vs WEAKENED/FALSIFIED-AS-STATED across the board before) but
      also a NEW finding one level up: the Ruling Theory Trap recurred in the
      CANDIDATE LIST itself (Stage 3's generic checklist isn't domain-complete
      -- missed publication bias in the POSITIVE mouse literature, failed
      human FMT trials, host-genotype interaction), and the recommended
      'cheapest test' turned out non-discriminating (same predicted result
      under 2 different hypotheses -- violates ach_matrix.md's own
      non-diagnostic-row rule, which was read but not applied row-by-row).
      Added Exhaustion Completeness check (Stage 3, delegates to
      narrow-discovery-engines Engine 4) and Full-row diagnosticity check
      (Stage 7). A third, independent object -- minimum wage/employment
      (Card-Krueger 1994 vs Neumark-Wascher 1996) -- produced a THIRD skeptic
      verdict worse than the first two: 'worse than a competent economist
      reading a review for 20 minutes.' Cause: a subtler failure class -- the
      generic Stage 1/3 checklist finds CONFLICTING RESULTS but not what the
      field itself names as the cause of disagreement (identification-strategy
      choice -- border-pairs vs synthetic control -- not 'data source' as
      assumed without searching for the field's own methodological dispute);
      plus H2 used an undetected unfalsifiable threshold mechanism ('effect
      holds below some threshold', no number given), and the Full-row check
      didn't catch the stratification variable itself being confounded with
      another hypothesis's driving variable. Added 3 more gates: mandatory
      'field's own methodological dispute' search as a separate Stage 1
      category (not covered by null-result searches), a numeric-threshold
      requirement for 'up-to-a-threshold' mechanisms (Stage 4), and a
      Stratifier-confound check (Stage 7, distinct from Full-row -- same
      'looked diagnostic, wasn't' failure class, one level deeper: at the
      cause of the prediction, not the prediction itself). This is the THIRD
      run->skeptic->fix cycle in a row without a clean LGTM -- per this repo's
      own Evaluator-Optimizer Guard (CLAUDE.md), autonomous iteration stops
      here; escalated to the user instead of a silent 4th cycle on a new
      object. Pattern across three objects: the method is reliable on objects
      with STANDARD conflict types (measurement, confounding, reverse
      causation -- ego depletion, partly microbiome), but systematically weak
      where the field's central dispute is about METHOD/identification
      strategy rather than a biological/behavioral mechanism (modern causal
      econometrics). This is a mapped, not hypothetical, boundary.
      Created 2026-08-30 as the third of three
      capability gaps found by comparing an external 'Negative-Space Hypothesis
      Miner' prompt template against the catalog -- the only one of the three
      with no existing home (Outcome Interpretation went to hypothesis-arbiter,
