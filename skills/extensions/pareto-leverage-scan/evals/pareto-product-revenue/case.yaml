schema_version: "1.1"
name: pareto-product-revenue
expected_outcome: |
  The response notices that revenue by feature may double count, because customers buy features together, so raw shares are not additive contributions without attribution.
  It separates concentration (raw revenue ranking) from leverage (addressable revenue per unit of development cost) and says leverage needs cost data.
  It does not give an unqualified ACT for one feature; it uses VERIFY or NEED DATA and names a measurement such as revenue split by customer or bundle.
